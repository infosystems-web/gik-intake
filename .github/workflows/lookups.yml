# Fills in name, price and proof links for every scanned barcode in the Supabase gik schema.
# Runs every hour (same daily totals as before, split into smaller runs so new scans are filled within an hour) and on demand (Actions tab > GIK lookups > Run workflow). Free for public repos.
name: GIK lookups
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency: gik-lookups
jobs:
  lookups:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary pytest
      - name: Safety tests (the run stops here if anything is broken, before touching the database)
        working-directory: lookup
        run: python -m pytest -q tests
      - name: Look up names, prices and links, then sync to Supabase
        working-directory: lookup
        env:
          GIK_DB: ${{ runner.temp }}/gik.db
          GIK_DB_PASSWORD: ${{ secrets.GIK_DB_PASSWORD }}
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
          UPCDATABASE_KEY: ${{ secrets.UPCDATABASE_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
          KROGER_LOCATION_ID: ${{ secrets.KROGER_LOCATION_ID }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          WALMART_CONSUMER_ID: ${{ secrets.WALMART_CONSUMER_ID }}
          WALMART_PRIVATE_KEY: ${{ secrets.WALMART_PRIVATE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          # per-run budgets sized for 24 runs a day, inside each free daily limit
          GIK_FILL: "150"
          GIK_EVIDENCE: "75"
          GIK_SERPER_PER_RUN: "7"
        # The repo is public until it moves to a private nonprofit organization: the full log (item names, barcodes)
        # goes to a file on the runner only; the public log shows summary lines and errors, never items.
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/run.log"
          status=0
          { python gik.py init && python gik.py cloud sync --max 250 --seed 50 && python bulk_products.py apply; } > "$LOG" 2>&1 || status=$?
          grep -E "^(Pulled from cloud|Done:|Refreshed|Book seed:|Catalog seed:|Price fill:|More places:|Three places:|Synced to cloud|Sync push|Named |Barcode prefix|Traceback|[A-Za-z0-9_.]*(Error|Exception))" "$LOG" || true
          exit $status
